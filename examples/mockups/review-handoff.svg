<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Review handoff mockup</title>
  <desc id="desc">An illustrative task card showing a review pending state and a link to inspect the change.</desc>
  <rect width="720" height="400" fill="#f2f5f7"/>
  <rect x="72" y="52" width="576" height="296" rx="16" fill="#ffffff" stroke="#c9d5db"/>
  <text x="112" y="105" font-family="sans-serif" font-size="18" fill="#526773">ILLUSTRATIVE PRODUCT DEFINITION</text>
  <text x="112" y="156" font-family="sans-serif" font-size="28" font-weight="bold" fill="#172c38">Review the change</text>
  <text x="112" y="197" font-family="sans-serif" font-size="17" fill="#344e5c">Independent review is pending for the current revision.</text>
  <rect x="112" y="237" width="178" height="48" rx="8" fill="#245c76"/>
  <text x="132" y="267" font-family="sans-serif" font-size="16" fill="#ffffff">Open the change</text>
</svg>
